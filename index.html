<style>
:root{--ink:#18202a;--dim:#5c6673;--border:#d7dee5;--bg:#f5f7f9;--white:#fff;--hi:#ab4d27;--mid:#92661b;--ok:#19664b}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #377bbb;outline-offset:2px}header{background:#fff;border-bottom:1px solid var(--border);padding:13px max(14px,calc((100vw - 1040px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}header b{letter-spacing:.08em;font-size:13px}header small{color:var(--dim)}main{max-width:1040px;margin:auto;padding:20px 14px 70px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tools{display:flex;gap:7px;flex-wrap:wrap}.btn{background:#18202a;color:white;border:1px solid #18202a;border-radius:5px;padding:8px 12px;text-decoration:none;font-size:12px}.btn.secondary{background:white;color:var(--ink)}.btn:disabled{opacity:.55}.muted{color:var(--dim)}.small{font-size:12px}.intro{margin:16px 0 18px}.intro h1{font-size:24px;line-height:1.17;margin:0 0 8px;letter-spacing:-.5px}.intro p{max-width:790px;margin:0;color:var(--dim)}.bar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:15px;min-width:0}.model h3{margin:7px 0 5px;font-size:17px;line-height:1.27}.tag{font-size:11px;font-weight:700;letter-spacing:.01em;border:1px solid var(--border);border-radius:20px;padding:3px 8px;display:inline-block}.tag.high{border-color:#e3b29e;color:var(--hi);background:#fff6f0}.tag.watch{border-color:#e4d6a1;color:var(--mid);background:#fdfaf1}.tag.calm{border-color:#bedacd;color:var(--ok);background:#f3faf6}.tag.neutral{background:#f4f6f7}.summary{font-size:13px;margin:6px 0}.cap{font-size:12px;color:var(--dim);margin:8px 0 0}h2{font-size:17px;letter-spacing:-.2px;margin:27px 0 10px}.ev{padding:7px 0;display:flex;gap:12px;justify-content:space-between;border-top:1px solid #edf0f3;font-size:12px}.ev span:last-child{font-weight:650;text-align:right;flex-shrink:0}.subtle{border-top:1px solid var(--border);padding-top:9px;margin-top:11px}.band{height:9px;overflow:hidden;background:#e9edf1;border-radius:12px;margin-top:7px}.band>i{display:block;height:100%;background:#6b8197;border-radius:12px}.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fact{background:white;border:1px solid var(--border);padding:12px;border-radius:7px}.fact b{display:block;font-size:21px}.fact small{color:var(--dim)}.notice{padding:12px 14px;border-left:3px solid #8290a2;background:#eef2f6;font-size:13px;margin:14px 0}.notice.warning{border-color:#c98d2f;background:#fff9ef}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fancyless{background:#fff;padding:14px;border:1px solid var(--border);border-radius:7px}.line{border-top:1px solid var(--border);padding:8px 0;display:flex;justify-content:space-between;gap:12px}details{background:white;border:1px solid var(--border);border-radius:6px;margin:7px 0;padding:0 12px}summary{font-weight:650;padding:10px 0;cursor:pointer}details>.line:first-of-type{border-top:1px solid var(--border)}.help{font-weight:600;border:1px solid #afb7bf;border-radius:50%;background:#fff;color:#39404a;width:22px;height:22px;margin-left:7px}.mutebtn{border:0;background:none;text-decoration:underline;color:var(--ink);padding:0;cursor:pointer;font-size:12px}canvas{width:100%;height:145px;display:block}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;border-bottom:1px solid #e5e9ef;padding:7px 5px}.tbl th{font-weight:650;color:var(--dim)}.pill{white-space:nowrap}.scroll{overflow-x:auto}.note{font-size:12px;color:var(--dim)}#overlay{display:none;position:fixed;inset:0;background:#f8fafc;z-index:11;overflow-y:auto;padding:18px}#overlay.open{display:block}#panel{max-width:690px;margin:auto;background:#fff;padding:20px;border:1px solid var(--border);border-radius:9px}#panel h2{margin:10px 0}.gloss{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--border);padding:10px 2px;cursor:pointer}.g-section{border-left:3px solid #d2dae1;padding:2px 12px;margin:15px 0}footer{padding-top:22px;color:var(--dim);font-size:11px}@media(max-width:730px){.bar-grid,.cols{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.intro h1{font-size:22px}main{padding-top:14px}}@media(max-width:420px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact b{font-size:17px}header{align-items:flex-start}header small{font-size:10px}}
</style></head><body>
<header><b>CRISIS ENGINE <span style="color:#576b81">v4.0</span></b><small id="stamp">—</small></header>
<main>
<div class="toolbar"><div class="muted small" id="status" role="status" aria-live="polite">Загружаю публикацию…</div><div class="tools"><button id="reload" class="btn" onclick="loadData()">↻ Обновить</button><button class="btn secondary" data-guide-back="1">? Справочник</button><a class="btn secondary" href="https://github.com/limonfree/crisis/actions" target="_blank" rel="noopener">Запустить сбор ↗</a></div></div>
<div class="intro"><h1>Что происходит в экономике и на рынках?</h1><p>Ваш независимый монитор фактов: четыре отдельные проверки, объяснения сигналов, реальные даты и прозрачная статистика. Никаких торговых приказов и выдуманных вероятностей.</p></div>
<div id="app"><div class="box">Загрузка…</div></div>
</main><div id="overlay"><div id="panel"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,n=1)=>Number.isFinite(x)?x.toLocaleString('ru-RU',{minimumFractionDigits:n,maximumFractionDigits:n}):'—';
const date=x=>typeof x==='string'&&x.length>=10?x.slice(8,10)+'.'+x.slice(5,7)+'.'+x.slice(0,4):'—';
const TITLES={market:'Рынок акций',credit_liquidity:'Кредит и деньги',macro:'Реальная экономика',crypto:'Криптовалюты'};
let L=null,H=null,A=null,E=null;
const GUIDE = {
  score:['Crisis Score · индекс напряжения','Сводит в одну шкалу от 0 до 100 признаки проблем с деньгами, кредитом, биржей и экономикой.','Чем выше число, тем больше измеренного моделью стресса. Смотреть надо и на направление изменения, и на составляющие.','Это авторская эвристика, а не вероятность кризиса, дефолта или падения биржи. Пороги не доказаны бэктестом.'],
  cycle:['Состояние экономики','Сопоставляет безработицу, заявки на пособие, правило Сэм и производственный опрос ФРБ Филадельфии.','Несколько одновременно ухудшающихся сигналов означают повышенный риск замедления.','Не измеряет ВВП напрямую. Официальную рецессию США определяет NBER задним числом.'],
  regime:['Рыночный режим','Учитывает падение S&P 500 от максимума, положение относительно 200-дневной средней, VIX и стресс кредитного рынка.','Risk-on означает более спокойный рынок, Late Risk-on — цены держатся высоко при слабых местах, Risk-off — ухудшение подтверждается ценами или волатильностью.','Ярлыки — условные категории алгоритма, а не рекомендации совершать сделки.'],
  quality:['Качество и свежесть','Показывает, сколько нужных показателей удалось получить и сколько из них достаточно свежие по приблизительному приблизительному календарю публикаций.','Высокое покрытие значит лишь больше доступных рядов.','97% покрытия не равны 97% точности анализа. Первичные данные могут пересматриваться и запаздывать.'],
  netliq:['Чистая ликвидность ФРС','Приближённый расчёт: баланс ФРС минус остаток казначейства в ФРС (TGA) минус деньги в overnight reverse repo.','Рост этого значения иногда создаёт более благоприятный фон для рискованных активов; падение может означать отток поддержки.','Это НЕ общий объём денег в экономике и не прямой прогноз S&P 500 или Bitcoin.'],
  liq:['Ликвидность','Сколько в финансовой системе доступных денег, и насколько они становятся дороже или доступнее.','Снижение чистой ликвидности и замедление денежной массы — признаки ужесточения.','Показатели ФРС, ЕЦБ и Банка Японии не полностью сопоставимы между собой.'],
  credit:['Кредит','Насколько трудно и дорого компаниям и банкам брать взаймы.','Расширение кредитных спредов и ужесточение банковских стандартов — неблагоприятные признаки.','Сам по себе высокий кредитный стресс не означает, что финансовый кризис уже наступил.'],
  market:['Финансовые рынки','Измеряет колебания акций и облигаций, ширину роста, доллар и защитные активы.','Высокое значение означает, что инвесторы более осторожны или рынок уже снижается.','Не каждое повышение волатильности приводит к кризису.'],
  macro:['Экономика','Суммирует показатели занятости, инфляции, деловой активности и доходности облигаций.','Рост безработицы и ухудшение производства могут означать охлаждение экономики.','Публикации запаздывают; экономика может измениться раньше статистики.'],
  netliq4:['Чистая ликвидность: 4 недели','Насколько изменилась упрощённая чистая ликвидность ФРС за последние четыре календарные недели.','Минус означает сокращение этой меры ликвидности; это добавляет стресс в модель.','ФРС может сокращать баланс без немедленного падения акций; важны также ставки и кредит.'],
  netliq12:['Чистая ликвидность: 12 недель','То же изменение ликвидности, но на горизонте 12 календарных недель.','Полезно для оценки направления среднесрочного денежного потока.','Не является мерой всей мировой ликвидности.'],
  m2yoy:['Денежная масса M2: за год','Изменение количества денег на банковских и близких к ним счетах США относительно того же месяца год назад.','Ускорение M2 может облегчать финансовые условия; замедление может указывать на осторожность банков и клиентов.','Сравнивается именно тот же календарный месяц; при отсутствующей базе цифра не вычисляется.'],
  m2ann3:['M2: годовой темп за три месяца','Темп изменения M2 за три месяца, пересчитанный так, будто он продолжался целый год.','Позволяет раньше увидеть ускорение или замедление денежной массы.','Это темп, а не фактический рост за год. Очень чувствителен к краткосрочным колебаниям.'],
  ecb13:['Баланс ЕЦБ','Изменение суммы активов Европейского центрального банка за 13 календарных недель.','Рост часто связан с расширением денежного баланса, снижение — с его сокращением.','Активы выражены в евро; их изменение не равно свободным деньгам на рынках США.'],
  boj3:['Баланс Банка Японии','Изменение активов центрального банка Японии за три календарных месяца.','Расширение баланса может смягчать условия финансирования.','Валютный эффект и структура операций могут менять связь с глобальным рынком.'],
  hy:['HY OAS','Дополнительная доходность облигаций компаний с низким рейтингом сверх сопоставимых государственных бумаг США.','Чем больше надбавка, тем осторожнее кредиторы и тем дороже рискованным компаниям занимать.','Кредитный спред не равен вероятности банкротства; условия зависят от ликвидности и структуры индекса.'],
  ccc:['CCC OAS','Кредитная надбавка по облигациям компаний с очень низким рейтингом CCC.','Резкий рост может указывать на серьёзные опасения за самых слабых заёмщиков.','Ряд ICE на FRED может иметь укороченную доступную историю; «исторический максимум» зависит от окна.'],
  bbb:['BBB OAS','Надбавка к доходности облигаций BBB — самой низкой категории инвестиционного рейтинга.','Рост показывает, что даже относительно качественные компании платят больше за риск.','Спред зависит также от состава и длительности облигаций.'],
  baa:['Moody’s Baa минус 10-летние гособлигации','Грубая мера того, сколько корпоративные облигации Baa платят сверх 10-летних облигаций США.','Рост может сигнализировать об усилении осторожности кредиторов.','Доходности не совпадают по срокам погашения и структуре, поэтому это не идеальный кредитный спред.'],
  hy4w:['Изменение HY-спреда за 4 недели','Изменение кредитной надбавки низкорейтинговых компаний за календарные четыре недели.','Положительное изменение означает удорожание риска; отрицательное — некоторое облегчение.','Показатель движения, а не абсолютный уровень кредитного риска.'],
  nfci:['NFCI · финансовые условия','Индекс Чикагского ФРБ, учитывающий цены риска, спреды и доступность финансирования.','Выше нуля — финансовые условия в среднем жёстче обычных; ниже нуля — мягче.','Ноль означает долгосрочную норму этого индекса, а не отсутствие кризиса.'],
  sloos:['SLOOS · кредитная политика банков','Опрос банков ФРС о том, смягчают они или ужесточают требования к коммерческим кредитам.','Положительное число в используемой серии обычно означает чистую долю банков, ужесточающих стандарты.','Опрос квартальный, отражает мнение банков, а не объём уже выданных кредитов.'],
  kre:['KRE · региональные банки США','Насколько котировка ETF региональных банков ниже максимума последних ~6 месяцев.','Сильное падение может показывать давление на небольшие банки.','Цена ETF отражает и общую оценку акций, не только риск банковских вкладов.'],
  vix:['VIX · ожидаемая волатильность','Ожидаемый рынком масштаб колебаний S&P 500 на ближайший месяц, выведенный из цен опционов.','Чем выше VIX, тем дороже страховка от колебаний и сильнее беспокойство участников.','Это не вероятность падения и не предсказанное направление индекса.'],
  move:['MOVE · волатильность облигаций','Индекс ожидаемых колебаний доходности казначейских облигаций США.','Рост говорит о неопределённости процентных ставок и стоимости долга.','Методология зависит от цен опционов и может меняться.'],
  spxdd:['S&P 500 · просадка','На сколько процентов индекс широкого рынка США ниже максимума за 52 недели торгов.','От −10% часто говорят о коррекции, от −20% — о медвежьем рынке (условные термины).','Не показывает, что случится дальше; падение иногда быстро сменяется ростом.'],
  breadth:['RSP/SPY · ширина рынка','Сравнение S&P 500 с равными весами компаний и обычного S&P 500 с весами по капитализации.','Если равновзвешенные компании проигрывают, подъём больше зависит от нескольких гигантов.','Это приближённая мера ширины, не буквальная доля растущих акций.'],
  narrow:['IWM/QQQ · малые компании против Nasdaq','Сравнивает динамику малого бизнеса в биржевом индексе Russell 2000 с крупными Nasdaq-компаниями.','Слабость IWM относительно QQQ может показывать неравномерный аппетит к риску.','На результат влияет отраслевой состав, а не только экономический цикл.'],
  dxy:['DXY · индекс доллара','Показывает силу доллара США относительно корзины валют за три календарных месяца.','Сильный доллар иногда затрудняет финансирование и снижает стоимость мировых активов в долларах.','Не измеряет покупательную способность доллара внутри США.'],
  usdjpy:['USD/JPY · доллар к иене','Сколько японских иен стоит один доллар США и как курс изменился за четыре недели.','Сильное укрепление иены (падение USD/JPY) иногда сопровождает сворачивание сделок с заёмной иеной.','Причины изменения курса разнообразны; один валютный курс не доказывает carry unwind.'],
  cug:['Медь к золоту','Относительная динамика цены меди и золота за три месяца.','Медь связана с промышленным спросом, золото часто служит защитным активом; падение отношения может указывать на осторожность.','Соотношение может двигаться из-за предложения металлов и курса валют, а не только из-за роста экономики.'],
  sahm:['Правило Сэм (Sahm Rule)','Сравнивает среднюю безработицу за 3 месяца с минимумом за предыдущий год.','Подъём на 0,5 процентного пункта или более исторически сопровождал рецессии США.','Не официальный диагноз и не универсальный закон; сигнал может ошибаться.'],
  unrate:['Безработица за год','Насколько выросла доля безработных США по сравнению с тем же месяцем прошлого года, в процентных пунктах.','Рост означает, что найти работу стало труднее.','Месячные оценки статистически шумные и иногда пересматриваются.'],
  claims:['Новые заявки на пособие','Сравнивает среднее количество новых заявок на пособие за 4 недели с минимумом последнего года.','Заметный рост может раньше официальной безработицы показать трудности у работодателей.','Праздники и сезонные поправки способны давать ложные скачки.'],
  gdpnow:['GDPNow · оценка роста ВВП','Оперативная оценка ФРБ Атланты темпа роста экономики в текущем квартале, пересчитанного на год.','Положительное число означает ожидаемый рост реального ВВП в этом квартале.','Дата ряда FRED не гарантирует дату публикации конкретной оценки. GDPNow не участвует в историческом скоринге.'],
  philly:['Philly Fed · промышленный опрос','Опрос производителей региона Филадельфии об изменении условий бизнеса.','Значение выше нуля обычно означает расширение относительно прошлого месяца, ниже нуля — ухудшение.','Региональный опрос, это не общенациональный ISM PMI.'],
  curve:['Кривая 10Y − 2Y','Разница доходностей 10-летних и 2-летних казначейских облигаций США. Сайт также отслеживает её минимум за 12 месяцев.','Отрицательная разница означает перевёрнутую кривую ставок и исторически часто предшествовала спадам.','Инверсия сама по себе не предсказывает точную дату или неизбежность рецессии.'],
  cpi:['CPI-U SA · инфляция за год','Изменение сезонно скорректированного индекса потребительских цен США к тому же календарному месяцу год назад.','Рост показывает удорожание типичной корзины товаров и услуг за год.','CPI-U SA YoY может отличаться от официального заголовочного показателя CPI-U NSA. Если прошлогоднего месяца нет, число не заменяется соседним.'],
  pce:['Core PCE · базовая инфляция','Изменение индекса цен потребительских расходов США без еды и энергии по сравнению с тем же месяцем год назад.','ФРС внимательно следит за этим индикатором долгосрочной инфляции.','Core PCE — не та же корзина и методология, что CPI. Публикуется с задержкой.'],
  y10:['Доходность облигаций США на 10 лет','Насколько процентная ставка по 10-летним гособлигациям изменилась за три календарных месяца.','Резкий рост может удорожать ипотеку, кредиты и снижать текущую цену старых облигаций.','Ставка может расти и из-за улучшения ожиданий роста, а не только из-за кризиса.']
};

const GROUPS=[['Общее',['score','cycle','regime','quality','netliq']],['Ликвидность',['netliq4','netliq12','m2yoy','m2ann3','ecb13','boj3']],['Кредит',['hy','ccc','bbb','baa','hy4w','nfci','sloos','kre']],['Рынок',['vix','move','spxdd','breadth','narrow','dxy','usdjpy','cug']],['Макроэкономика',['sahm','unrate','claims','gdpnow','philly','curve','cpi','pce','y10']]];
function openGuide(id){const dst=$('#panel');if(id==='all'){
 dst.innerHTML='<button class="btn secondary" onclick="closeGuide()">× Закрыть</button><h2>Справочник: простыми словами</h2><p class="muted">Что измеряется, как это читать и чего показатель не доказывает.</p>'+GROUPS.map(([name,ids])=>'<h2>'+esc(name)+'</h2>'+ids.map(k=>'<button class="gloss" data-help="'+esc(k)+'">'+esc(GUIDE[k]?.[0]||k)+' ›</button>').join('')).join('');
}else {const g=GUIDE[id];if(!g)return openGuide('all');const x=L?.indicators?.find(y=>y.id===id);
 dst.innerHTML='<button class="btn secondary" data-guide-back="1">← Назад</button> <button class="btn secondary" onclick="closeGuide()">×</button><h2>'+esc(g[0])+'</h2>'+(x?'<div class="notice">Сейчас: <b>'+esc(x.disp)+'</b> · наблюдение '+date(x.obs)+' · статус '+esc(x.status)+'</div>':'')+[['Что измеряет',g[1]],['Как понимать',g[2]],['Чего не доказывает',g[3]]].map(([n,v])=>'<div class="g-section"><b>'+esc(n)+'</b><p>'+esc(v)+'</p></div>').join('')+(x?.url?'<a href="'+esc(x.url)+'" rel="noopener" target="_blank">Перейти к источнику ↗</a>':'');}
 $('#overlay').classList.add('open');$('#overlay').scrollTop=0;}
function closeGuide(){$('#overlay').classList.remove('open')}
document.addEventListener('click',e=>{let back=e.target.closest('[data-guide-back]');if(back){openGuide('all');return;}let el=e.target.closest('[data-help]');if(el)openGuide(el.dataset.help)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGuide()});
async function fetchJSON(path,critical=false){let r=await fetch(path+(path.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok){if(critical)throw Error(path+': HTTP '+r.status);return null}return r.json()}
async function loadData(){const b=$('#reload');b.disabled=true;$('#status').textContent='Читаю свежие опубликованные JSON…';try{
 const [l,h,a,e]=await Promise.all([fetchJSON('data/latest.json',true),fetchJSON('data/history.json').catch(()=>null),fetchJSON('data/signal_log.json').catch(()=>null),fetchJSON('data/evaluation.json').catch(()=>null)]);
 if(!l||l.schema!==4||!l.diagnostics?.models)throw Error('Файлы v4 ещё не опубликованы или несовместимы');
 L=l;H=h;A=a;E=e;render();$('#stamp').textContent='сборка '+date(l.asof);
 let hours=(Date.now()-Date.parse(l.generated_at))/36e5;$('#status').textContent='Сборка '+date(l.asof)+' · '+(hours>36?'данные не обновлялись '+Math.round(hours)+' ч':'данные опубликованы, возраст '+Math.max(0,hours).toFixed(1)+' ч');
}catch(err){$('#status').textContent='Ошибка данных';if(!L)$('#app').innerHTML='<div class="notice warning">'+esc(err.message||err)+' · Проверьте GitHub Actions и дату последней публикации.</div>';else $('#app').insertAdjacentHTML('afterbegin','<div class="notice warning">'+esc(err.message||err)+' · Показаны предыдущие данные.</div>');}finally{b.disabled=false}}
function evidence(t){return '<div class="ev"><span>'+esc(t.label)+'</span><span>'+(t.flag===null?'нет данных':t.flag?'● подтверждено':'○ не сработало')+' · '+esc(t.value===null?'—':typeof t.value==='number'?num(t.value,2):t.value)+'</span></div>'}
function modelCard(id,m){return '<article class="box model"><div class="tag '+esc(m.tone)+'">'+esc(TITLES[id])+'</div><h3>'+esc(m.label)+'</h3><p class="summary">'+esc(m.summary)+'</p><p class="cap">'+esc(m.scope)+'</p><div class="subtle">'+(m.tests||[]).map(evidence).join('')+'</div><p class="cap">'+esc(m.qualification)+'</p></article>'}
function ind(id){return L.indicators.find(x=>x.id===id)}
function fact(id,title){let x=ind(id);return '<div class="fact"><small>'+esc(title)+'</small><b>'+esc(x?.disp||'—')+'</b><button class="mutebtn" data-help="'+id+'">Что это?</button><div class="note">наблюдение '+date(x?.obs)+'</div></div>'}
function overview(){let m=L.diagnostics.models;let disag=L.diagnostics.disagreements||[];return '<div class="bar-grid">'+Object.keys(TITLES).map(k=>modelCard(k,m[k])).join('')+'</div><div class="notice"><b>Общий смысл:</b> эти модели независимы и могут расходиться. '+(disag.length?disag.map(esc).join(' '):'Явных расхождений по заданным правилам сейчас нет. Это не означает, что риск отсутствует.')+'</div>'}
function chart(rows){if(!rows?.length)return '<p class="muted small">Архив начнётся с первого успешного запуска v4. Старые пересчитанные графики не используются для проверки точности.</p>';return '<canvas id="archiveChart" aria-label="График фактически заархивированного экспериментального Crisis Score"></canvas><p class="note">Только опубликованные снимки. Сам индекс — экспериментальный; график не доказывает способность предсказывать цены.</p>'}
function archive(){let entries=A?.entries||[];let s='<h2>Фактический архив сигналов</h2><div class="box"><div class="muted small">'+(A?'Снимков с начала v4: '+A.n_total+' · начало '+date(A.start_date):'Файл архива ещё не опубликован')+'</div>'+chart(entries.filter(x=>Number.isFinite(x.score_reference)))+'</div>';return s}
function evaluation(){let out='<h2>Strategy Lab · будущая проверка</h2><div class="notice warning"><b>Пока это НЕ бэктест на винтажах прошлого.</b> Проверяем только сигналы, реально записанные начиная с v4, и реальные последующие закрытия. Для показа статистической частоты нужно минимум 30 независимых завершённых эпизодов. До этого вероятности не выводятся.</div>';
 if(!E?.models)return out+'<div class="box">Статистика появится после первого запуска v4 и дальнейших наблюдений.</div>';
 out+='<div class="box scroll"><table class="tbl"><thead><tr><th>Модель</th><th>Актив</th><th>Новых сессий</th><th>Завершено</th><th>Ожидается</th><th>Коррекция ≥10%</th></tr></thead><tbody>';
 for(const [model,assets] of Object.entries(E.models))for(const [asset,hs] of Object.entries(assets))for(const [h,x] of Object.entries(hs))out+='<tr><td>'+esc(TITLES[model])+'</td><td>'+esc(asset)+'</td><td>'+h+'</td><td>'+esc(x.n_mature)+'</td><td>'+esc(x.n_pending)+'</td><td>'+(x.reportable?num(x.event_rate*100,1)+'% <span class="small muted">(историческая частота, не прогноз)</span>':'недостаточно данных')+'</td></tr>';
 let sens=(E.threshold_sensitivity||[]).map(x=>'<div class="line"><span>'+esc(x.name)+'</span><span>'+x.cutoffs.map(y=>esc(y.threshold)+': '+esc(y.days_triggered)+' дн.').join(' · ')+'</span></div>').join('');
 return out+'</tbody></table><h3>Чувствительность порогов · дни срабатывания</h3>'+sens+'<p class="note">Частота сигналов при разных порогах — не их доходность или качество. Пороги не подбирались по результатам.</p><p class="note">Возможная коррекция измеряется по закрытиям, не внутридневным минимумам. Частота не равна вероятности в будущем. Контрольная группа и издержки пока не реализованы.</p></div>'}
function indicatorSections(){return '<h2>Все исходные показатели · раскрыть и проверить</h2>'+[['liq','Ликвидность'],['credit','Кредит'],['market','Рынок'],['macro','Экономика']].map(([id,name])=>'<details><summary>'+name+' · '+esc(L.blocks?.[id]?.ok)+' свежих из '+esc(L.blocks?.[id]?.n)+'</summary>'+L.indicators.filter(x=>x.blk===id).map(x=>'<div class="line"><span>'+esc(x.name)+' <button class="help" data-help="'+esc(x.id)+'" aria-label="Объяснить">?</button><div class="note">'+esc(x.src)+' · дата '+date(x.obs)+' · '+esc(x.status)+'</div></span><b>'+esc(x.disp)+'</b></div>').join('')+'</details>').join('')}
function render(){let q=L.quality;let generated=Date.parse(L.generated_at);let age=(Date.now()-generated)/36e5;
 let html='';if(!L.valid||age>36)html+='<div class="notice warning">'+(!L.valid?'Итоговые данные неполны: '+esc(L.reason):'Последняя сборка старше 36 часов. Не выдаём это за текущую оценку.')+'</div>';
 html+='<div class="notice"><b>Что здесь факт, а что модель?</b> Значения HY, VIX, CPI и других рядов — данные источников с указанными датами. Пороговые режимы — объяснимые, но пока не валидированные гипотезы. Торговых команд нет.</div>';
 html+=overview();html+='<h2>Ключевые измерения</h2><div class="facts">'+[['hy','HY OAS'],['vix','VIX'],['cpi','Инфляция CPI-U SA, г/г'],['netliq4','Net Liquidity, 4 недели']].map(([k,n])=>fact(k,n)).join('')+'</div>';
 html+=archive();html+=evaluation();html+='<h2>Экспериментальный индекс v3 (справочно)</h2><div class="box"><div class="muted small">Авторский стресс-индекс, не вероятность кризиса и не торговый сигнал.</div><div style="font-size:25px;font-weight:750">'+esc(L.score?num(L.score.value):'—')+' / 100</div>'+Object.values(L.blocks||{}).map(b=>'<div class="line"><span>'+esc(b.ru)+'</span><b>'+num(b.score)+'</b></div>').join('')+'</div>';
 html+='<h2>Качество и ограничения</h2><div class="box"><div>Свежие данные: <b>'+esc(q.ok)+' из '+esc(q.n)+'</b> · устарели '+esc(q.stale)+' · отсутствуют '+esc(q.missing)+'</div><p class="note">Доступность ≠ достоверность прогноза. Даты выхода части статистики приблизительные. Часть рядов пересматривается. Подробности — в справочнике и методологии.</p>'+(q.problems||[]).slice(0,6).map(x=>'<div class="ev"><span>'+esc(x.name)+'</span><span>'+esc(x.status)+'</span></div>').join('')+'</div>';
 html+=indicatorSections();html+='<footer>CRISIS ENGINE v4 · без рекламных рекомендаций · данные загружаются в момент открытия из GitHub Pages, сам новый сбор запускается через GitHub Actions. Код, формулы и архив сигналов доступны в репозитории.</footer>';
 $('#app').innerHTML=html;if(A?.entries?.length)drawArchive(A.entries);
}
function drawArchive(entries){const points=entries.filter(x=>Number.isFinite(x.score_reference));const c=$('#archiveChart');if(!c||points.length<2){if(c)c.replaceWith(Object.assign(document.createElement('p'),{textContent:'Для графика нужны минимум два фактически зафиксированных дня.'}));return}
 const w=Math.max(100,c.clientWidth),h=c.clientHeight,r=Math.min(window.devicePixelRatio||1,2);c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);const min=0,max=100;
 x.strokeStyle='#cad1d9';x.lineWidth=1;x.beginPath();for(let n=0;n<=4;n++){let y=12+(h-28)*n/4;x.moveTo(12,y);x.lineTo(w-8,y)}x.stroke();x.strokeStyle='#2e6586';x.lineWidth=2.1;x.beginPath();points.forEach((p,i)=>{let px=13+i*(w-23)/(points.length-1),py=12+(h-28)*(1-p.score_reference/100);if(!i)x.moveTo(px,py);else x.lineTo(px,py)});x.stroke();x.font='11px sans-serif';x.fillStyle='#667381';x.fillText(date(points[0].date),12,h-2);x.fillText(date(points[points.length-1].date),w-90,h-2)}
loadData();
</script></body></html>
