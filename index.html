<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRISIS ENGINE">
<title>Crisis Engine v3.3 · Dashboard</title>
<style>
:root{--line:#111;--soft:#dcdcdc;--dim:#6b6b6b;--red:#e2001a;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--line);font:14px/1.4 -apple-system,Helvetica,Arial,sans-serif;padding-bottom:48px;-webkit-font-smoothing:antialiased}
.m{font-family:ui-monospace,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
header h1{white-space:nowrap;margin:0;font:700 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px}
header span{font-size:10px;color:var(--dim);text-align:right;line-height:1.3}
main{max-width:760px;margin:0 auto;padding:14px}
.warn{border:1px solid var(--line);padding:9px 11px;margin-bottom:10px;font-size:12px}
.warn.red{border-color:var(--red);color:var(--red)}
.head{font-size:15px;font-weight:600;line-height:1.35;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{border:1px solid var(--line);padding:12px;cursor:pointer;min-height:96px}
.card:active{background:#f5f5f5}
.card.wide{grid-column:1/3}
.eb{font:9px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.big{font:700 32px/1 ui-monospace,Menlo,Consolas,monospace}
.big.t{font-size:19px;line-height:1.15}
.sub{font-size:11px;color:var(--dim);margin-top:6px}
.red{color:var(--red)}
.mode{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--soft);font-size:13px}
.mode:first-of-type{border-top:0}
.seg{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;margin-left:8px}
h2{font:700 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:13px}
.row .v{font:12px ui-monospace,Menlo,Consolas,monospace;text-align:right;white-space:nowrap}
.dim{color:var(--dim);font-size:11px}
.chip{font:10px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--soft);padding:1px 5px;color:var(--dim)}
.chip.stale{border-color:var(--line);color:var(--line)}
.chip.missing{border-color:var(--red);color:var(--red)}
.bar{height:4px;background:var(--soft);margin-top:4px}.bar i{display:block;height:100%;background:var(--line)}
a{color:inherit}
details{border-bottom:1px solid var(--soft)}
summary{padding:9px 0;cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:0 0 40px;display:none}
#sheet.open{display:block}
#sheet .in{max-width:760px;margin:0 auto;padding:14px}
.x{float:right;cursor:pointer;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);padding:4px}
.tabs{display:flex;border:1px solid var(--line);margin:10px 0 6px}
.tabs button{flex:1;border:0;border-left:1px solid var(--line);background:none;font:11px ui-monospace,Menlo,Consolas,monospace;padding:7px;cursor:pointer}
.tabs button:first-child{border-left:0}.tabs button.on{background:var(--line);color:#fff}
canvas{width:100%;height:140px;display:block}
.notice{background:#f6f6f6;border-left:3px solid #111;padding:10px 12px;margin:10px 0;font-size:12px} .notice strong{display:block;margin-bottom:3px} .note{font-size:11px;color:var(--dim);line-height:1.5;margin-top:18px}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.tools{display:flex;gap:7px;align-items:center}.btn{border:1px solid #111;background:#111;color:white;font:600 12px -apple-system,Arial,sans-serif;padding:9px 12px;border-radius:4px;cursor:pointer}.btn.secondary{background:#fff;color:#111}.btn:disabled{opacity:.5;cursor:wait}.mini{font-size:11px;color:#666}
.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.panel{border:1px solid #d6d6d6;padding:12px;border-radius:5px;min-width:0}
.panel.full{grid-column:1/-1}.kpi{font:700 32px/1.1 ui-monospace,Menlo,monospace;margin:8px 0}.kpi span{font-size:13px;color:#666;font-weight:400}
.stressTrack{height:14px;border-radius:4px;background:linear-gradient(90deg,#3a8e71 0%,#d7ba4f 42%,#e38946 70%,#c84444 100%);position:relative;margin:14px 0 7px}.stressNeedle{position:absolute;top:-5px;bottom:-5px;width:3px;background:#111;border:1px solid white}
.metric{display:grid;grid-template-columns:112px 1fr 32px;gap:8px;align-items:center;font-size:12px;margin:12px 0}.metricTrack{height:10px;background:#eee;border-radius:3px;overflow:hidden}.metricFill{height:100%;background:#455569}.metricFill.high{background:#bd6545}.metricFill.low{background:#538777}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:#666}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.chartHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.chartControls{display:flex;gap:4px}.chartControls button{font-size:11px;border:1px solid #ccc;background:#fff;padding:4px 7px;cursor:pointer;border-radius:3px}.chartControls button.active{background:#111;color:white;border-color:#111}
@media(max-width:430px){.dashboard{grid-template-columns:1fr}.panel.full{grid-column:auto}header{gap:6px}header h1{font-size:11px;letter-spacing:1px}.metric{grid-template-columns:100px 1fr 30px}}
</style>
</head>
<body>
<header><h1>CRISIS ENGINE v3.3</h1><span class="m" id="ts">—</span></header>
<main><div class="toolbar"><div class="mini" id="loadState" role="status" aria-live="polite">Загрузка данных…</div><div class="tools"><button type="button" class="btn" id="refreshBtn" onclick="loadData()">↻ Обновить</button><a class="btn secondary" href="https://github.com/limonfree/crisis/actions" target="_blank" rel="noopener noreferrer" title="Запустить новый сбор в GitHub Actions">Новый сбор ↗</a></div></div><div id="app"><div class="warn">Загрузка…</div></div>
</main><div id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '—').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD = iso => typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(8,10) + '.' + iso.slice(5,7) + '.' + iso.slice(0,4) : '—';
const sgn = (v, d = 1) => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(d);
const SEG = l => Number.isInteger(l) && l >= 0 && l <= 3 ? '■'.repeat(l + 1) + '□'.repeat(3 - l) : '—';
const TREND = {up:'↑ растёт', down:'↓ снижается', flat:'→ без изменений'};
const ST = {ok:'по сроку', stale:'устарел', missing:'нет данных'};
const nfmt = (v,d=0) => Number.isFinite(v) ? v.toFixed(d) : '—';
const dateOnly = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !Number.isNaN(Date.parse(v+'T00:00:00Z'));
const conservativeRegime = t => /кризис/i.test(t || '') ? 'Повышенный стресс (кризис не подтверждён)' : (t || 'Не определён');
const allocationLabel = v => v ? `Правило модели: ${v}` : 'нет сигнала';
function validate(l) {
  if (!l || l.schema !== 3 || !dateOnly(l.asof) || !l.generated_at || !Number.isFinite(Date.parse(l.generated_at))) throw Error('неверная схема, дата или время расчёта');
  if (!l.quality || !Array.isArray(l.indicators) || !l.blocks || !l.cycle || !l.regime || !l.crypto) throw Error('JSON не содержит обязательных разделов');
  if (!['liq','credit','market','macro'].every(k => l.blocks[k] && Number.isFinite(l.blocks[k].cov))) throw Error('неверные блоки индекса');
  if (l.valid && (!l.score || !Number.isFinite(l.score.value) || l.score.value < 0 || l.score.value > 100)) throw Error('некорректный итоговый индекс');
  if (new Date(l.generated_at).getTime() > Date.now()+3600000) throw Error('дата расчёта находится в будущем');
  return l;
}
let L, H, days = 90;

async function loadData() {
  const btn=$('#refreshBtn'), status=$('#loadState');
  btn.disabled=true; btn.textContent='Обновление…'; status.textContent='Проверяю опубликованные JSON…';
  try {
    const stamp=Date.now();
    const [r1,r2]=await Promise.all([
      fetch('data/latest.json?t='+stamp,{cache:'no-store'}),
      fetch('data/history.json?t='+stamp,{cache:'no-store'}).catch(()=>null)
    ]);
    if(!r1.ok) throw Error('latest.json: HTTP '+r1.status);
    const l=validate(await r1.json());
    const h=(r2&&r2.ok) ? await r2.json().catch(()=>null) : null;
    L=l; H=h&&Array.isArray(h.dates)?h:null;
    render();
    const age=Math.max(0,(Date.now()-Date.parse(L.generated_at))/36e5);
    status.textContent='Файлы проверены · расчёт '+fmtD(L.asof)+' · '+(age>36?'устарел':'возраст '+age.toFixed(1)+' ч');
  }catch(e){
    status.textContent='Ошибка обновления';
    if(!L) $('#app').innerHTML='<div class="warn red">Не удалось загрузить данные: '+esc(e.message||e)+'</div>';
    else { const old=$('#fetchError'); if(old)old.remove(); $('#app').insertAdjacentHTML('afterbegin','<div class="warn red" id="fetchError">Обновление не удалось: '+esc(e.message||e)+'. Сохранены предыдущие данные.</div>'); }
  }finally{btn.disabled=false;btn.textContent='↻ Обновить';}
}
loadData();

function ind(blk) { return L.indicators.filter(x => x.blk === blk); }
function indRows(list) {
  return list.map(x => `<div class="row"><div>${esc(x.name)}<div class="dim">${x.status === 'missing' ? esc(x.why || '') : 'наблюдение ' + fmtD(x.obs) + ' · расч. дата доступности ≈ ' + fmtD(x.pub) + ' · '}${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>` : esc(x.src)}</div></div>
    <div class="v">${esc(x.disp)}<div><span class="chip ${x.status}">${ST[x.status] || 'не определён'}${x.status !== 'missing' && Number.isFinite(x.stress) ? ' · стресс ' + Math.round(x.stress) : ''}</span></div></div></div>`).join('');
}

function render() {
  const q = L.quality, s = L.score, b = L.blocks, v = L.invest;
  const gen = new Date(L.generated_at), hrs = (Date.now() - gen) / 36e5;
  const asofAge = (Date.now()-Date.parse(L.asof+'T23:59:59Z'))/86400000;
  $('#ts').innerHTML = 'данные на ' + esc(L.asof) + '<br>сборка ' + gen.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  let h = '';
  if (hrs > 36) h += `<div class="warn red">Сборщик не обновлял данные ${Math.round(hrs)} ч. Показано последнее успешное состояние, не текущее.</div>`;
  if (asofAge > 2) h += `<div class="warn red">Дата аналитической оценки старше 2 дней. Это архивное состояние, не оценка рынка сейчас.</div>`;
  if (!L.valid) h += `<div class="warn red">Недостаточно данных для итогового индекса и рекомендаций. ${esc(L.reason)}</div>`;
  else if (q.stale) h += `<div class="warn">Часть показателей устарела (${q.stale}) и исключена из расчёта. Подробности — «Качество данных».</div>`;
  h += `<div class="head">${L.valid ? `Состояние: ${esc(L.cycle.label)} · рынок: ${esc(L.regime.label)} · модельный стресс: ${nfmt(L.score?.value,1)}/100` : 'Недостаточно достоверных данных для итоговой оценки'}</div>`;
  h += `<div class="notice"><strong>Важно об интерпретации</strong>Стресс-индекс — эвристическая агрегированная оценка, а не вероятность рецессии или сигнал покупать/продавать. «Рост» и «Risk-off» относятся к разным измерениям и могут сосуществовать. Проверка охвата источников не является независимым подтверждением точности данных.</div>`;

  const nl = L.netliq;
  const scoreOk=L.valid&&s&&Number.isFinite(s.value);
  const pct=x=>Number.isFinite(x)?Math.max(0,Math.min(100,x)):0;
  h += `<section class="dashboard" aria-label="Ключевые показатели">
    <div class="panel"><div class="eb">Финансовый стресс · шкала модели</div><div class="kpi">${scoreOk?nfmt(s.value,1):'—'} <span>/ 100</span></div><div class="stressTrack"><span class="stressNeedle" style="left:calc(${scoreOk?pct(s.value):0}% - 2px);display:${scoreOk?'block':'none'}"></span></div><div class="legend"><span><i style="background:#3a8e71"></i>низкий</span><span><i style="background:#d7ba4f"></i>повышенный</span><span><i style="background:#c84444"></i>высокий</span></div><div class="sub">${scoreOk?esc(s.band)+' · '+esc(TREND[s.trend]||'динамика неизвестна'):'Недостаточно данных'}</div></div>
    <div class="panel"><div class="eb">Коротко о состоянии</div><div style="font-size:17px;font-weight:650;margin:7px 0">${esc(L.cycle.label||'—')}</div><div class="sub">Экономика (модель)</div><div style="font-size:17px;font-weight:650;margin:10px 0 2px">${esc(L.regime.label||'—')}</div><div class="sub">Финансовые рынки (модель)</div></div>
    <div class="panel full"><div class="eb">Состав стресса · четыре направления, 0–100</div>${['liq','credit','market','macro'].map(k=>{const x=b[k], z=x?.score;return `<div class="metric"><span>${esc(x?.name||k)}</span><div class="metricTrack"><div class="metricFill ${z>=65?'high':z<=35?'low':''}" style="width:${pct(z)}%"></div></div><strong class="m">${nfmt(z)}</strong></div>`}).join('')}<div class="dim">Больше значение — выше стресс. Блоки основаны на разных показателях и весах.</div></div>
    <div class="panel full"><div class="chartHead"><div class="eb">Динамика Crisis Score</div><div class="chartControls">${[30,90,365].map(d=>`<button type="button" class="${days===d?'active':''}" onclick="setDays(${d})">${d} дн.</button>`).join('')}</div></div>${H&&Array.isArray(H.score)&&H.score.some(Number.isFinite)?'<canvas id="trendScore" role="img" aria-label="История индекса финансового стресса"></canvas>':'<div class="dim" style="padding:22px 0">Исторический график недоступен</div>'}<div class="dim">Исторические значения из history.json; не прогноз.</div></div>
    <div class="panel"><div class="eb">Чистая ликвидность ФРС*</div><div class="kpi" style="font-size:23px">${nl&&Number.isFinite(nl.value)?'$'+nfmt(nl.value/1000,2):'—'} <span>трлн $</span></div><div class="sub">${nl?.d4&&Number.isFinite(nl.d4.usd)?'За 4 недели: '+sgn(nl.d4.usd,0)+' млрд $':'Нет динамики'}${nl?.stale?' · устарело':''}</div></div>
    <div class="panel"><div class="eb">Качество входных данных</div><div class="kpi" style="font-size:23px">${nfmt(q.coverage*100)}<span>% покрытие</span></div><div class="sub">Свежесть: ${nfmt(q.freshness*100)}% · отсутствует: ${esc(q.missing)}</div><div class="sub">Не показатель точности прогноза</div></div>
  </section><div class="dim">* Упрощённая оценка WALCL − TGA − ON RRP, не полная ликвидность рынков.</div>`;
  h += `<details><summary>Подробные карточки и правила модели <span>▾</span></summary><div class="grid">
   <div class="card" onclick="openSheet('cycle')"><div class="eb">Режим экономики</div><div class="big t">${esc(L.cycle.label)}</div><div class="sub">${L.cycle.n != null ? 'подтверждений: ' + L.cycle.n + ' из 5' : esc(L.cycle.why)}</div></div>
   <div class="card" onclick="openSheet('score')"><div class="eb">Crisis Score · стресс 0–100</div><div class="big ${s && s.value >= 70 ? 'red' : ''}">${L.valid && s ? Math.round(s.value) : '—'}</div><div class="sub">${L.valid && s ? esc(s.band) + ' · ' + (TREND[s.trend] || 'динамика не определена') : 'нет валидного индекса'}</div></div>
   <div class="card" onclick="openSheet('netliq')"><div class="eb">Net Liquidity</div><div class="big t">${nl ? '$' + (nl.value / 1000).toFixed(2) + ' трлн' : '—'}</div><div class="sub">${nl ? '4 нед.: ' + sgn(nl.d4.usd, 0) + ' млрд (' + sgn(nl.d4.pct) + '%)' + (nl.stale ? ' · устарело' : '') : 'нет данных'}</div></div>
   <div class="card" onclick="openSheet('credit')"><div class="eb">Credit Stress</div><div class="big">${b.credit.score != null ? Math.round(b.credit.score) : '—'}</div><div class="sub">${b.credit.score != null ? 'Δ 4 нед.: ' + sgn(b.credit.delta, 0) : 'покрытие ' + Math.round(b.credit.cov * 100) + '%'}</div></div>
   <div class="card wide" onclick="openSheet('invest')"><div class="eb">Экспериментальные правила модели · не сделки</div>${v ? [['Акции', v.modes.equity], ['BTC', v.modes.btc], ['ETH', v.modes.eth]].map(([n, m]) => `<div class="mode"><span>${n}</span><span>${m ? `<span class="${m.level === 3 ? 'red' : ''}">${esc(allocationLabel(m.label))}</span><span class="seg ${m.level === 3 ? 'red' : ''}">${SEG(m.level)}</span>` : '<span class="dim">недостаточно данных</span>'}</span></div>`).join('') : '<div class="sub">Рекомендации не выдаются при недостаточном покрытии данных.</div>'}</div>
  </div></details>`;

  if (v && L.valid) {
    h += `<h2>Рынок</h2><div class="row"><div>Режим рынка<div class="dim">${esc(L.regime.why)}</div></div><div class="v">${esc(L.regime.label)}</div></div>`;
    if (L.regime.type) h += `<div class="row"><div>Природа стресса</div><div class="v">${esc(conservativeRegime(L.regime.type))}</div></div>`;
    h += `<div class="row"><div>Риск системного кризиса</div><div class="v">${esc(v.risk)} · ${TREND[v.trend || 'flat'] || '—'}</div></div>`;
    h += `<h2>Условные сценарии модели · не прогноз и не вероятности</h2>` + v.scenarios.map(x => `<div class="row"><div><b>${esc(x.h)}</b> · ${esc(x.lean)}<div class="dim">${esc(x.drivers)}<br>смотреть: ${esc(x.watch)}</div></div></div>`).join('') +
      `<div class="note" style="margin-top:6px">Вероятности не показываются: модель не откалибрована (см. BACKTEST.md).</div>`;
    h += `<h2>Условия перехода</h2>` + v.transitions.map(x => `<div class="row"><div>${x.met ? '●' : '○'} → ${esc(x.to)}<div class="dim">${esc(x.cond)}<br>сейчас: ${esc(x.now)}</div></div><div class="v">${x.met ? 'выполнено' : '—'}</div></div>`).join('');
    h += `<h2>Три главных фактора</h2>` + v.factors.map(x => `<div class="row"><div>${x.up ? '▲' : '▼'} ${esc(x.name)}<div class="dim">${esc(x.blk)} · стресс ${nfmt(x.stress)}/100</div></div><div class="v">${esc(x.disp)}</div></div>`).join('');
    if (v.consistency.length) h += `<div class="warn red" style="margin-top:10px">Нарушена согласованность: ${esc(v.consistency.join('; '))}</div>`;
  }
  h += `<h2>Качество данных</h2>
   <div class="row"><div>Покрытие источников<div class="bar"><i style="width:${q.coverage * 100}%"></i></div></div><div class="v">${nfmt(q.coverage * 100)}%</div></div>
   <div class="row"><div>Свежесть (по календарю публикаций)<div class="bar"><i style="width:${q.freshness * 100}%"></i></div></div><div class="v">${nfmt(q.freshness * 100)}%</div></div>
   <div class="dim" style="padding-top:6px">ок ${q.ok} · устарело ${q.stale} · нет данных ${q.missing} из ${q.n}. Это автоматические проверки покрытия и срока; не проверка источников или точности прогноза.</div>`;
  h += `<h2>Все показатели</h2>` + ['liq', 'credit', 'market', 'macro'].map(k => `<details><summary><span>${esc(b[k].name)}</span><span class="m">${b[k].score != null ? Math.round(b[k].score) : '—'} · ${b[k].ok}/${b[k].n}</span></summary>${indRows(ind(k))}</details>`).join('');
  h += `<div class="note">Индекс — эвристический стресс, а не вероятность кризиса. Устаревшие и отсутствующие значения не подменяются нулём и не участвуют в расчёте. Источники согласно метаданным сборщика: FRED и связанные серии, Yahoo Finance, DefiLlama, OKX. Факт актуальности каждого показателя требует проверки даты наблюдения и методики. Историческая проверка — BACKTEST.md.</div>`;
  $('#app').innerHTML = h;
  if(H && Array.isArray(H.score) && Array.isArray(H.dates)) drawTo('trendScore',H.score,H.dates,'');
}

function openSheet(k) {
  const b = L.blocks, nl = L.netliq, m2 = L.m2, v = L.invest, s = L.score;
  let t = '', big = '', body = '', series = null, unit = '';
  if (k === 'cycle') {
    t = 'Режим экономики'; big = L.cycle.label;
    body = `<div class="dim">${esc(L.cycle.why)}. Это внутреннее правило классификатора, не официальное объявление рецессии. Отсутствие 3 подтверждений не гарантирует отсутствие рецессии.</div>` + L.cycle.signals.map(x => `<div class="row"><div>${x.on ? '●' : x.on === false ? '○' : '·'} ${esc(x.name)}</div><div class="v">${esc(x.val)}</div></div>`).join('') +
      (L.regime.label ? `<h2>Рыночный режим</h2><div class="row"><div>${esc(L.regime.label)}<div class="dim">${esc(L.regime.why)}</div></div><div class="v">${esc(conservativeRegime(L.regime.type))}</div></div>` : '');
  } else if (k === 'score') {
    t = 'Crisis Score'; big = s ? Math.round(s.value) : '—'; series = 'score';
    body = s ? `<div class="dim">Δ за 4 нед.: ${sgn(s.delta)}. База ${s.base.toFixed(1)} + подтверждение ${s.bonus_conf} + скорость ${s.bonus_speed}. Блоков ≥ 60: ${s.n_conf}.</div>` : `<div class="warn red">${esc(L.reason)}</div>`;
    body += ['liq', 'credit', 'market', 'macro'].map(x => `<div class="row"><div>${esc(b[x].name)} · вес ${Math.round(b[x].weight * 100)}%<div class="dim">сдвиг за 4 нед. (Δ стресса): ${esc(b[x].why)}</div></div><div class="v">${b[x].score != null ? Math.round(b[x].score) : '—'}<div class="dim">Δ ${sgn(b[x].delta, 0)}</div></div></div>`).join('');
  } else if (k === 'netliq') {
    t = 'Net Liquidity'; series = 'netliq'; unit = ' млрд $';
    big = nl ? '$' + (nl.value / 1000).toFixed(2) + ' трлн' : '—';
    body = nl ? `<div class="dim">WALCL − TGA − ON RRP · наблюдение ${nl.obs}</div>
     ${nl.walcl != null ? `<div class="row"><div>WALCL / TGA / ON RRP</div><div class="v">${nl.walcl} / ${nl.tga} / ${nl.rrp} млрд $</div></div>` : ''}
     ${[['1 нед.', nl.d1], ['4 нед.', nl.d4], ['12 нед.', nl.d12]].map(([n, d]) => `<div class="row"><div>Изменение за ${n}</div><div class="v">${sgn(d.usd, 0)} млрд (${sgn(d.pct, 2)}%)</div></div>`).join('')}` : '<div class="warn red">Нет данных</div>';
    if (m2) body += `<h2>M2 · три разные величины</h2>
     <div class="row"><div>Изменение за 3 мес. (факт)</div><div class="v">${sgn(m2.chg3_usd, 0)} млрд (${sgn(m2.chg3_pct, 2)}%)</div></div>
     <div class="row"><div>Годовой темп (3 мес. ann.)</div><div class="v">${sgn(m2.ann3, 2)}%</div></div>
     <div class="row"><div>Год к году (YoY)</div><div class="v">${sgn(m2.yoy, 2)}%</div></div>
     <div class="dim">Последнее наблюдение ${m2.obs}: месячный ряд публикуется с лагом, это не «устаревание».</div>`;
    body += `<h2>Показатели блока</h2>` + indRows(ind('liq'));
  } else if (k === 'credit') {
    t = 'Credit Stress'; big = b.credit.score != null ? Math.round(b.credit.score) : '—'; series = 'credit';
    body = `<div class="dim">Сдвиг за 4 нед. (Δ стресса): ${esc(b.credit.why)}</div>` + indRows(ind('credit'));
  } else if (k === 'invest') {
    t = 'Экспериментальные правила риска'; big = '';
    body = v ? [['Акции', v.modes.equity], ['BTC', v.modes.btc], ['ETH', v.modes.eth]].map(([n, m]) => m ? `<div class="row"><div><b>${n}</b> · ${esc(allocationLabel(m.label))}<div class="dim">${esc(m.why)}</div></div><div class="v seg">${SEG(m.level)}</div></div>` : '').join('') : '<div class="warn red">Рекомендации не выдаются: ' + esc(L.reason || 'недостаточно данных') + '</div>';
    body += `<div class="dim" style="padding-top:8px">Уровни — внутренние категории модели, не торговые сигналы. Прежде чем применять к капиталу, нужен бэктест без знания будущего, издержки, просадки и сравнение с buy-and-hold.</div><h2>Крипторынок</h2>` +
      L.crypto.items.map(x => `<div class="row"><div>${esc(x.name)}<div class="dim"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>${x.state ? ' · ' + esc(x.state) : ''}</div></div><div class="v">${esc(x.disp)}</div></div>`).join('');
  }
  $('#sheetIn').innerHTML = `<span class="x" onclick="$('#sheet').classList.remove('open')">× закрыть</span><div class="eb">${esc(t)}</div><div class="big t">${esc(big)}</div>` +
    (series && H && Array.isArray(H[series]) ? `<div class="tabs">${[30, 90, 365].map(d => `<button class="${d === days ? 'on' : ''}" onclick="days=${d};openSheet('${k}')">${d} дн.</button>`).join('')}</div><canvas id="cv"></canvas><div class="dim">${esc(H.note)}</div>` : '') + body;
  $('#sheet').classList.add('open');
  if (series && H && Array.isArray(H[series])) draw(H[series], H.dates, unit);
}

function setDays(d){days=d;render();}
function draw(vals, dates, unit) { drawTo('cv',vals,dates,unit); }
function drawTo(id, vals, dates, unit) {
  const c = document.getElementById(id); if(!c || !Array.isArray(vals) || !Array.isArray(dates))return;
  const r = Math.min(window.devicePixelRatio || 1,2), w = c.clientWidth, h = c.clientHeight;
  c.width = w * r; c.height = h * r;
  const g = c.getContext('2d'); g.scale(r, r);
  const n = Math.min(days, vals.length, dates.length), V = vals.slice(-n), Dt = dates.slice(-n), ok = V.filter(Number.isFinite);
  g.font = '10px ui-monospace,Menlo,monospace'; g.fillStyle = '#6b6b6b'; g.strokeStyle = '#111'; g.lineWidth = 1.5;
  if (!ok.length) { g.fillText('Нет данных', 4, 16); return; }
  let lo = Math.min(...ok), hi = Math.max(...ok); if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  const X = i => 4 + i * (w - 8) / Math.max(1, n - 1), Y = y => h - 14 - (y - lo) / (hi - lo) * (h - 26);
  g.beginPath(); let pen = false;
  V.forEach((y, i) => { if (!Number.isFinite(y)) { pen = false; return; } pen ? g.lineTo(X(i), Y(y)) : g.moveTo(X(i), Y(y)); pen = true; });
  g.stroke();
  g.fillText(hi.toFixed(unit ? 0 : 0) + unit, 4, 10); g.fillText(lo.toFixed(0) + unit, 4, h - 16);
  g.fillText(String(Dt[0] || '').slice(5), 4, h - 2); const e = String(Dt[n - 1] || '').slice(5); g.fillText(e, w - 4 - g.measureText(e).width, h - 2);
}
</script>
