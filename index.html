<style>
:root{--line:#111;--soft:#dcdcdc;--dim:#6b6b6b;--red:#e2001a;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--line);font:14px/1.4 -apple-system,Helvetica,Arial,sans-serif;padding-bottom:48px;-webkit-font-smoothing:antialiased}
.m{font-family:ui-monospace,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
header h1{white-space:nowrap;margin:0;font:700 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px}
header span{font-size:10px;color:var(--dim);text-align:right;line-height:1.3}
main{max-width:760px;margin:0 auto;padding:14px}
.warn{border:1px solid var(--line);padding:9px 11px;margin-bottom:10px;font-size:12px}
.warn.red{border-color:var(--red);color:var(--red)}
.head{font-size:15px;font-weight:600;line-height:1.35;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{border:1px solid var(--line);padding:12px;cursor:pointer;min-height:96px}
.card:active{background:#f5f5f5}
.card.wide{grid-column:1/3}
.eb{font:10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.big{font:700 32px/1 ui-monospace,Menlo,Consolas,monospace}
.big.t{font-size:19px;line-height:1.15}
.sub{font-size:12px;color:var(--dim);margin-top:6px}
.red{color:var(--red)}
.mode{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--soft);font-size:13px}
.mode:first-of-type{border-top:0}
.seg{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;margin-left:8px}
h2{font:700 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:13px}
.row .v{font:12px ui-monospace,Menlo,Consolas,monospace;text-align:right;white-space:nowrap}
.dim{color:var(--dim);font-size:12px}
.chip{font:10px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--soft);padding:1px 5px;color:var(--dim)}
.chip.stale{border-color:var(--line);color:var(--line)}
.chip.missing{border-color:var(--red);color:var(--red)}
.bar{height:4px;background:var(--soft);margin-top:4px}.bar i{display:block;height:100%;background:var(--line)}
a{color:inherit}
details{border-bottom:1px solid var(--soft)}
summary{padding:9px 0;cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:0 0 40px;display:none}
#sheet.open{display:block}
#sheet .in{max-width:760px;margin:0 auto;padding:14px}
.x{float:right;cursor:pointer;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);padding:4px}
.tabs{display:flex;border:1px solid var(--line);margin:10px 0 6px}
.tabs button{flex:1;border:0;border-left:1px solid var(--line);background:none;font:11px ui-monospace,Menlo,Consolas,monospace;padding:7px;cursor:pointer}
.tabs button:first-child{border-left:0}.tabs button.on{background:var(--line);color:#fff}
canvas{width:100%;height:140px;display:block}
.notice{background:#f6f6f6;border-left:3px solid #111;padding:10px 12px;margin:10px 0;font-size:12px} .notice strong{display:block;margin-bottom:3px} .note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:18px}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.tools{display:flex;gap:7px;align-items:center}.btn{border:1px solid #111;background:#111;color:white;font:600 12px -apple-system,Arial,sans-serif;padding:9px 12px;border-radius:4px;cursor:pointer}.btn.secondary{background:#fff;color:#111}.btn:disabled{opacity:.5;cursor:wait}.mini{font-size:11px;color:#666}
.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.panel{border:1px solid #d6d6d6;padding:12px;border-radius:5px;min-width:0}
.panel.full{grid-column:1/-1}.kpi{font:700 32px/1.1 ui-monospace,Menlo,monospace;margin:8px 0}.kpi span{font-size:13px;color:#666;font-weight:400}
.stressTrack{height:14px;border-radius:4px;background:linear-gradient(90deg,#3a8e71 0%,#d7ba4f 42%,#e38946 70%,#c84444 100%);position:relative;margin:14px 0 7px}.stressNeedle{position:absolute;top:-5px;bottom:-5px;width:3px;background:#111;border:1px solid white}
.metric{display:grid;grid-template-columns:112px 1fr 32px;gap:8px;align-items:center;font-size:12px;margin:12px 0}.metricTrack{height:10px;background:#eee;border-radius:3px;overflow:hidden}.metricFill{height:100%;background:#455569}.metricFill.high{background:#bd6545}.metricFill.low{background:#538777}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:#666}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.chartHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.chartControls{display:flex;gap:4px}.chartControls button{font-size:11px;border:1px solid #ccc;background:#fff;padding:4px 7px;cursor:pointer;border-radius:3px}.chartControls button.active{background:#111;color:white;border-color:#111}
@media(max-width:430px){.dashboard{grid-template-columns:1fr}.panel.full{grid-column:auto}header{gap:6px}header h1{font-size:11px;letter-spacing:1px}.metric{grid-template-columns:100px 1fr 30px}}

.infoButton{font:700 12px/1 ui-monospace,Menlo,monospace;border:1px solid #aaa;background:#fff;color:#222;border-radius:100%;width:22px;height:22px;cursor:pointer;margin-left:7px;vertical-align:middle;flex-shrink:0}
.infoButton:focus-visible,.btn:focus-visible,.guideItem:focus-visible{outline:3px solid #4285f4;outline-offset:2px}
.guideItem{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #ddd;cursor:pointer;padding:10px 1px;font:13px/1.35 -apple-system,Arial,sans-serif}
.guideItem:hover{background:#f7f7f7}
.guideBody{margin:15px 0 10px;display:grid;gap:12px;line-height:1.55}
.guidePart{border-left:3px solid #d4d7da;padding:2px 0 2px 12px}
.guidePart b{display:block;font-size:12px;margin-bottom:3px}
.plain{background:#f8f9fa;border:1px solid #dfe3e6;border-radius:5px;padding:12px;margin:12px 0;font-size:13px;line-height:1.55}
.plain b{display:block;margin-bottom:5px}
.inlineHelp{border:0;background:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:inherit;font-size:inherit;padding:0}
#sheet .in{padding-bottom:80px}
#sheet .in .back{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;margin-bottom:12px}
@media(max-width:430px){.toolbar{align-items:stretch}.tools{flex-wrap:wrap}.btn{padding:8px 10px}.row{font-size:12px}}
</style>

<header><h1>CRISIS ENGINE v3.4</h1><span class="m" id="ts">—</span></header>
<main><div class="toolbar"><div class="mini" id="loadState" role="status" aria-live="polite">Загрузка данных…</div><div class="tools"><button type="button" class="btn" id="refreshBtn" onclick="loadData()">↻ Обновить</button><button type="button" class="btn secondary" onclick="openGuide('all')">? Справочник</button><a class="btn secondary" href="https://github.com/limonfree/crisis/actions" target="_blank" rel="noopener noreferrer" title="Запустить новый сбор в GitHub Actions">Новый сбор ↗</a></div></div><div id="app"><div class="warn">Загрузка…</div></div>
</main><div id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '—').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD = iso => typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(8,10) + '.' + iso.slice(5,7) + '.' + iso.slice(0,4) : '—';
const sgn = (v, d = 1) => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(d);
const SEG = l => Number.isInteger(l) && l >= 0 && l <= 3 ? '■'.repeat(l + 1) + '□'.repeat(3 - l) : '—';
const TREND = {up:'↑ растёт', down:'↓ снижается', flat:'→ без изменений'};
const ST = {ok:'по сроку', stale:'устарел', missing:'нет данных', reference:'справочно'};
const nfmt = (v,d=0) => Number.isFinite(v) ? v.toFixed(d) : '—';
const dateOnly = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !Number.isNaN(Date.parse(v+'T00:00:00Z'));
const conservativeRegime = t => /кризис/i.test(t || '') ? 'Повышенный стресс (кризис не подтверждён)' : (t || 'Не определён');
const allocationLabel = v => v ? `Правило модели: ${v}` : 'нет сигнала';
function validate(l) {
  if (!l || l.schema !== 3 || !dateOnly(l.asof) || !l.generated_at || !Number.isFinite(Date.parse(l.generated_at))) throw Error('неверная схема, дата или время расчёта');
  if (!l.quality || !Array.isArray(l.indicators) || !l.blocks || !l.cycle || !l.regime || !l.crypto) throw Error('JSON не содержит обязательных разделов');
  if (!['liq','credit','market','macro'].every(k => l.blocks[k] && Number.isFinite(l.blocks[k].cov))) throw Error('неверные блоки индекса');
  if (l.valid && (!l.score || !Number.isFinite(l.score.value) || l.score.value < 0 || l.score.value > 100)) throw Error('некорректный итоговый индекс');
  if (new Date(l.generated_at).getTime() > Date.now()+3600000) throw Error('дата расчёта находится в будущем');
  return l;
}

// Each series has a plain-language definition, interpretation and limitations.
// These descriptions are NOT model-generated predictions.
const GUIDE = {
  score:['Crisis Score · индекс напряжения','Сводит в одну шкалу от 0 до 100 признаки проблем с деньгами, кредитом, биржей и экономикой.','Чем выше число, тем больше измеренного моделью стресса. Смотреть надо и на направление изменения, и на составляющие.','Это авторская эвристика, а не вероятность кризиса, дефолта или падения биржи. Пороги не доказаны бэктестом.'],
  cycle:['Состояние экономики','Сопоставляет безработицу, заявки на пособие, правило Сэм и производственный опрос ФРБ Филадельфии.','Несколько одновременно ухудшающихся сигналов означают повышенный риск замедления.','Не измеряет ВВП напрямую. Официальную рецессию США определяет NBER задним числом.'],
  regime:['Рыночный режим','Учитывает падение S&P 500 от максимума, положение относительно 200-дневной средней, VIX и стресс кредитного рынка.','Risk-on означает более спокойный рынок, Late Risk-on — цены держатся высоко при слабых местах, Risk-off — ухудшение подтверждается ценами или волатильностью.','Ярлыки — условные категории алгоритма, а не рекомендации совершать сделки.'],
  quality:['Качество и свежесть','Показывает, сколько нужных показателей удалось получить и сколько из них достаточно свежие по приблизительному приблизительному календарю публикаций.','Высокое покрытие значит лишь больше доступных рядов.','97% покрытия не равны 97% точности анализа. Первичные данные могут пересматриваться и запаздывать.'],
  netliq:['Чистая ликвидность ФРС','Приближённый расчёт: баланс ФРС минус остаток казначейства в ФРС (TGA) минус деньги в overnight reverse repo.','Рост этого значения иногда создаёт более благоприятный фон для рискованных активов; падение может означать отток поддержки.','Это НЕ общий объём денег в экономике и не прямой прогноз S&P 500 или Bitcoin.'],
  liq:['Ликвидность','Сколько в финансовой системе доступных денег, и насколько они становятся дороже или доступнее.','Снижение чистой ликвидности и замедление денежной массы — признаки ужесточения.','Показатели ФРС, ЕЦБ и Банка Японии не полностью сопоставимы между собой.'],
  credit:['Кредит','Насколько трудно и дорого компаниям и банкам брать взаймы.','Расширение кредитных спредов и ужесточение банковских стандартов — неблагоприятные признаки.','Сам по себе высокий кредитный стресс не означает, что финансовый кризис уже наступил.'],
  market:['Финансовые рынки','Измеряет колебания акций и облигаций, ширину роста, доллар и защитные активы.','Высокое значение означает, что инвесторы более осторожны или рынок уже снижается.','Не каждое повышение волатильности приводит к кризису.'],
  macro:['Экономика','Суммирует показатели занятости, инфляции, деловой активности и доходности облигаций.','Рост безработицы и ухудшение производства могут означать охлаждение экономики.','Публикации запаздывают; экономика может измениться раньше статистики.'],
  netliq4:['Чистая ликвидность: 4 недели','Насколько изменилась упрощённая чистая ликвидность ФРС за последние четыре календарные недели.','Минус означает сокращение этой меры ликвидности; это добавляет стресс в модель.','ФРС может сокращать баланс без немедленного падения акций; важны также ставки и кредит.'],
  netliq12:['Чистая ликвидность: 12 недель','То же изменение ликвидности, но на горизонте 12 календарных недель.','Полезно для оценки направления среднесрочного денежного потока.','Не является мерой всей мировой ликвидности.'],
  m2yoy:['Денежная масса M2: за год','Изменение количества денег на банковских и близких к ним счетах США относительно того же месяца год назад.','Ускорение M2 может облегчать финансовые условия; замедление может указывать на осторожность банков и клиентов.','Сравнивается именно тот же календарный месяц; при отсутствующей базе цифра не вычисляется.'],
  m2ann3:['M2: годовой темп за три месяца','Темп изменения M2 за три месяца, пересчитанный так, будто он продолжался целый год.','Позволяет раньше увидеть ускорение или замедление денежной массы.','Это темп, а не фактический рост за год. Очень чувствителен к краткосрочным колебаниям.'],
  ecb13:['Баланс ЕЦБ','Изменение суммы активов Европейского центрального банка за 13 календарных недель.','Рост часто связан с расширением денежного баланса, снижение — с его сокращением.','Активы выражены в евро; их изменение не равно свободным деньгам на рынках США.'],
  boj3:['Баланс Банка Японии','Изменение активов центрального банка Японии за три календарных месяца.','Расширение баланса может смягчать условия финансирования.','Валютный эффект и структура операций могут менять связь с глобальным рынком.'],
  hy:['HY OAS','Дополнительная доходность облигаций компаний с низким рейтингом сверх сопоставимых государственных бумаг США.','Чем больше надбавка, тем осторожнее кредиторы и тем дороже рискованным компаниям занимать.','Кредитный спред не равен вероятности банкротства; условия зависят от ликвидности и структуры индекса.'],
  ccc:['CCC OAS','Кредитная надбавка по облигациям компаний с очень низким рейтингом CCC.','Резкий рост может указывать на серьёзные опасения за самых слабых заёмщиков.','Ряд ICE на FRED может иметь укороченную доступную историю; «исторический максимум» зависит от окна.'],
  bbb:['BBB OAS','Надбавка к доходности облигаций BBB — самой низкой категории инвестиционного рейтинга.','Рост показывает, что даже относительно качественные компании платят больше за риск.','Спред зависит также от состава и длительности облигаций.'],
  baa:['Moody’s Baa минус 10-летние гособлигации','Грубая мера того, сколько корпоративные облигации Baa платят сверх 10-летних облигаций США.','Рост может сигнализировать об усилении осторожности кредиторов.','Доходности не совпадают по срокам погашения и структуре, поэтому это не идеальный кредитный спред.'],
  hy4w:['Изменение HY-спреда за 4 недели','Изменение кредитной надбавки низкорейтинговых компаний за календарные четыре недели.','Положительное изменение означает удорожание риска; отрицательное — некоторое облегчение.','Показатель движения, а не абсолютный уровень кредитного риска.'],
  nfci:['NFCI · финансовые условия','Индекс Чикагского ФРБ, учитывающий цены риска, спреды и доступность финансирования.','Выше нуля — финансовые условия в среднем жёстче обычных; ниже нуля — мягче.','Ноль означает долгосрочную норму этого индекса, а не отсутствие кризиса.'],
  sloos:['SLOOS · кредитная политика банков','Опрос банков ФРС о том, смягчают они или ужесточают требования к коммерческим кредитам.','Положительное число в используемой серии обычно означает чистую долю банков, ужесточающих стандарты.','Опрос квартальный, отражает мнение банков, а не объём уже выданных кредитов.'],
  kre:['KRE · региональные банки США','Насколько котировка ETF региональных банков ниже максимума последних ~6 месяцев.','Сильное падение может показывать давление на небольшие банки.','Цена ETF отражает и общую оценку акций, не только риск банковских вкладов.'],
  vix:['VIX · ожидаемая волатильность','Ожидаемый рынком масштаб колебаний S&P 500 на ближайший месяц, выведенный из цен опционов.','Чем выше VIX, тем дороже страховка от колебаний и сильнее беспокойство участников.','Это не вероятность падения и не предсказанное направление индекса.'],
  move:['MOVE · волатильность облигаций','Индекс ожидаемых колебаний доходности казначейских облигаций США.','Рост говорит о неопределённости процентных ставок и стоимости долга.','Методология зависит от цен опционов и может меняться.'],

function openGuide(id){
 const dst=$('#sheetIn');
 if(id==='all'){
   dst.innerHTML=`<button class="back" type="button" onclick="closeSheet()">× Закрыть</button><div class="eb">Справочник</div><h3>Что говорят цифры простым языком</h3><div class="dim">Нажмите на показатель, чтобы узнать его смысл, как читать и чего он НЕ доказывает.</div>`+
    GUIDE_GROUPS.map(([group,ids])=>`<h2>${esc(group)}</h2>`+ids.map(k=>`<button class="guideItem" type="button" data-guide="${esc(k)}">${esc(GUIDE[k][0])} ›</button>`).join('')).join('');
 }else{
   const g=GUIDE[id];
   if(!g)return openGuide('all');
   const cur=L?.indicators?.find(x=>x.id===id);
   dst.innerHTML=`<button type="button" class="back" onclick="openGuide('all')">← Справочник</button><button type="button" class="x" onclick="closeSheet()">× Закрыть</button><div class="eb">Понятным языком</div><h3>${esc(g[0])}</h3>`+
      (cur?`<div class="plain"><b>Сейчас: ${esc(cur.disp||'—')}</b>Данные: ${esc(ST[cur.status]||cur.status)} · наблюдение ${fmtD(cur.obs)}${cur.status==='ok' && Number.isFinite(cur.stress)?' · относительный стресс '+nfmt(cur.stress)+'/100':''}</div>`:'')+
      `<div class="guideBody"><div class="guidePart"><b>Что измеряет</b>${esc(g[1])}</div><div class="guidePart"><b>Как читать</b>${esc(g[2])}</div><div class="guidePart"><b>Что важно не перепутать</b>${esc(g[3])}</div></div>`+
      (cur?.url?`<p class="dim">Источник: <a href="${esc(cur.url)}" rel="noopener noreferrer" target="_blank">${esc(cur.src||'открыть первоисточник')}</a></p>`:'');
 }
 $('#sheet').classList.add('open');
 $('#sheet').scrollTop=0;
}
function closeSheet(){ $('#sheet').classList.remove('open'); }
document.addEventListener('click',e=>{const t=e.target.closest('[data-guide]');if(t)openGuide(t.dataset.guide);});
function clearSummary(){
 if(!L?.valid)return 'Не хватает данных, чтобы сделать обоснованный общий вывод. Отдельные доступные показатели можно изучить ниже.';
 const credit=L.blocks.credit?.score, liq=L.blocks.liq?.score, m=L.regime?.state;
 const messages=[];
 if(credit>=60)messages.push('Кредиторам тревожно: брать деньги компаниям относительно сложнее.');
 else if(credit<40)messages.push('Кредитные условия по выбранным метрикам относительно спокойны.');
 if(liq>=60)messages.push('Есть признаки напряжения с ликвидностью.');
 if(['riskoff','crisis','correction','capitulation'].includes(m)) messages.push('На бирже ухудшение подтверждается ценами или колебаниями.');
 else if(m==='late')messages.push('Биржа пока держится, но некоторые признаки риска ухудшаются.');
 else if(m==='riskon')messages.push('Ценовые признаки рыночного стресса ограничены.');
 if(L.cycle?.state==='growth')messages.push('Четыре макросигнала пока не подтверждают спад; это не гарантия роста.');
 return messages.join(' ')||'Есть смешанные сигналы: нужен разбор отдельных блоков.';
}

let L, H, days = 90;

async function loadData() {
  const btn=$('#refreshBtn'), status=$('#loadState');
  btn.disabled=true; btn.textContent='Обновление…'; status.textContent='Проверяю опубликованные JSON…';
  try {
    const stamp=Date.now();
    const [r1,r2]=await Promise.all([
      fetch('data/latest.json?t='+stamp,{cache:'no-store'}),
      fetch('data/history.json?t='+stamp,{cache:'no-store'}).catch(()=>null)
    ]);
    if(!r1.ok) throw Error('latest.json: HTTP '+r1.status);
    const l=validate(await r1.json());
    const h=(r2&&r2.ok) ? await r2.json().catch(()=>null) : null;
    L=l; H=h&&Array.isArray(h.dates)&&(!h.model_version||h.model_version===l.model_version)?h:null;
    render();
    const age=Math.max(0,(Date.now()-Date.parse(L.generated_at))/36e5);
    status.textContent='Файлы проверены · расчёт '+fmtD(L.asof)+' · '+(age>36?'устарел':'возраст '+age.toFixed(1)+' ч');
  }catch(e){
    status.textContent='Ошибка обновления';
    if(!L) $('#app').innerHTML='<div class="warn red">Не удалось загрузить данные: '+esc(e.message||e)+'</div>';
    else { const old=$('#fetchError'); if(old)old.remove(); $('#app').insertAdjacentHTML('afterbegin','<div class="warn red" id="fetchError">Обновление не удалось: '+esc(e.message||e)+'. Сохранены предыдущие данные.</div>'); }
  }finally{btn.disabled=false;btn.textContent='↻ Обновить';}
}
loadData();

  const nl = L.netliq;

    h += `<h2>Текущие изменения и показатели для наблюдения · не прогноз</h2>` + v.scenarios.map(x => `<div class="row"><div><b>${esc(x.h)}</b> · ${esc(x.lean)}<div class="dim">${esc(x.drivers)}<br>смотреть: ${esc(x.watch)}</div></div></div>`).join('') +
      `<div class="note" style="margin-top:6px">Вероятности не показываются: модель не откалибрована (см. BACKTEST.md).</div>`;
    h += `<h2>Условия перехода</h2>` + v.transitions.map(x => `<div class="row"><div>${x.met ? '●' : '○'} → ${esc(x.to)}<div class="dim">${esc(x.cond)}<br>сейчас: ${esc(x.now)}</div></div><div class="v">${x.met ? 'выполнено' : '—'}</div></div>`).join('');
    h += `<h2>Три главных фактора</h2>` + v.factors.map(x => `<div class="row"><div>${x.up ? '▲' : '▼'} ${esc(x.name)}<div class="dim">${esc(x.blk)} · стресс ${nfmt(x.stress)}/100</div></div><div class="v">${esc(x.disp)}</div></div>`).join('');
    if (v.consistency.length) h += `<div class="warn red" style="margin-top:10px">Нарушена согласованность: ${esc(v.consistency.join('; '))}</div>`;
  }
  h += `<h2>Качество данных</h2>
   <div class="row"><div>Покрытие источников<div class="bar"><i style="width:${q.coverage * 100}%"></i></div></div><div class="v">${nfmt(q.coverage * 100)}%</div></div>
   <div class="row"><div>Свежесть (по приблизительному календарю публикаций)<div class="bar"><i style="width:${q.freshness * 100}%"></i></div></div><div class="v">${nfmt(q.freshness * 100)}%</div></div>
   <div class="dim" style="padding-top:6px">ок ${q.ok} · устарело ${q.stale} · нет данных ${q.missing} из ${q.n}. Это автоматические проверки покрытия и срока; не проверка источников или точности прогноза.</div>`;
  h += `<h2>Все показатели</h2>` + ['liq', 'credit', 'market', 'macro'].map(k => `<details><summary><span>${esc(b[k].name)}</span><span class="m">${b[k].score != null ? Math.round(b[k].score) : '—'} · ${b[k].ok}/${b[k].n}</span></summary>${indRows(ind(k))}</details>`).join('');
  h += `<div class="note">Индекс — эвристический стресс, а не вероятность кризиса. Устаревшие и отсутствующие значения не подменяются нулём и не участвуют в расчёте. Источники согласно метаданным сборщика: FRED и связанные серии, Yahoo Finance, DefiLlama, OKX. Факт актуальности каждого показателя требует проверки даты наблюдения и методики. Историческая проверка — BACKTEST.md.</div>`;
  $('#app').innerHTML = h;
  if(H && Array.isArray(H.score) && Array.isArray(H.dates)) drawTo('trendScore',H.score,H.dates,'');
}

function openSheet(k) {
  const b = L.blocks, nl = L.netliq, m2 = L.m2, v = L.invest, s = L.score;
  let t = '', big = '', body = '', series = null, unit = '';
  if (k === 'cycle') {
    t = 'Режим экономики'; big = L.cycle.label;
    body = `<div class="dim">${esc(L.cycle.why)}. Это внутреннее правило классификатора, не официальное объявление рецессии. Отсутствие трёх сигналов не гарантирует отсутствие рецессии.</div>` + L.cycle.signals.map(x => `<div class="row"><div>${x.on ? '●' : x.on === false ? '○' : '·'} ${esc(x.name)}</div><div class="v">${esc(x.val)}</div></div>`).join('') +
      (L.regime.label ? `<h2>Рыночный режим</h2><div class="row"><div>${esc(L.regime.label)}<div class="dim">${esc(L.regime.why)}</div></div><div class="v">${esc(conservativeRegime(L.regime.type))}</div></div>` : '');
  } else if (k === 'score') {
    t = 'Crisis Score'; big = s ? Math.round(s.value) : '—'; series = 'score';
    body = s ? `<div class="dim">Δ за 4 нед.: ${sgn(s.delta)}. База ${s.base.toFixed(1)} + подтверждение ${s.bonus_conf} + скорость ${s.bonus_speed}. Блоков ≥ 60: ${s.n_conf}.</div>` : `<div class="warn red">${esc(L.reason)}</div>`;
    body += ['liq', 'credit', 'market', 'macro'].map(x => `<div class="row"><div>${esc(b[x].name)} · вес ${Math.round(b[x].weight * 100)}%<div class="dim">сдвиг за 4 нед. (Δ стресса): ${esc(b[x].why)}</div></div><div class="v">${b[x].score != null ? Math.round(b[x].score) : '—'}<div class="dim">Δ ${sgn(b[x].delta, 0)}</div></div></div>`).join('');
  } else if (k === 'netliq') {
    t = 'Net Liquidity'; series = 'netliq'; unit = ' млрд $';
    big = nl ? '$' + (nl.value / 1000).toFixed(2) + ' трлн' : '—';
    body = nl ? `<div class="dim">WALCL − TGA − ON RRP · наблюдение ${nl.obs}</div>
     ${nl.walcl != null ? `<div class="row"><div>WALCL / TGA / ON RRP</div><div class="v">${nl.walcl} / ${nl.tga} / ${nl.rrp} млрд $</div></div>` : ''}
     ${[['1 нед.', nl.d1], ['4 нед.', nl.d4], ['12 нед.', nl.d12]].map(([n, d]) => `<div class="row"><div>Изменение за ${n}</div><div class="v">${sgn(d.usd, 0)} млрд (${sgn(d.pct, 2)}%)</div></div>`).join('')}` : '<div class="warn red">Нет данных</div>';
    if (m2) body += `<h2>M2 · три разные величины</h2>
     <div class="row"><div>Изменение за 3 мес. (факт)</div><div class="v">${sgn(m2.chg3_usd, 0)} млрд (${sgn(m2.chg3_pct, 2)}%)</div></div>
     <div class="row"><div>Годовой темп (3 мес. ann.)</div><div class="v">${sgn(m2.ann3, 2)}%</div></div>
     <div class="row"><div>Год к году (YoY)</div><div class="v">${sgn(m2.yoy, 2)}%</div></div>
     <div class="dim">Последнее наблюдение ${m2.obs}: месячный ряд публикуется с лагом, это не «устаревание».</div>`;
    body += `<h2>Показатели блока</h2>` + indRows(ind('liq'));
  } else if (k === 'credit') {
    t = 'Credit Stress'; big = b.credit.score != null ? Math.round(b.credit.score) : '—'; series = 'credit';
    body = `<div class="dim">Сдвиг за 4 нед. (Δ стресса): ${esc(b.credit.why)}</div>` + indRows(ind('credit'));
  } else if (k === 'invest') {
    t = 'Экспериментальные правила риска'; big = '';
    body = v ? [['Акции', v.modes.equity], ['BTC', v.modes.btc], ['ETH', v.modes.eth]].map(([n, m]) => m ? `<div class="row"><div><b>${n}</b> · ${esc(allocationLabel(m.label))}<div class="dim">${esc(m.why)}</div></div><div class="v seg">${SEG(m.level)}</div></div>` : '').join('') : '<div class="warn red">Рекомендации не выдаются: ' + esc(L.reason || 'недостаточно данных') + '</div>';
    body += `<div class="dim" style="padding-top:8px">Уровни настороженности — внутренние категории модели, не торговые сигналы. Прежде чем применять к капиталу, нужен бэктест без знания будущего, издержки, просадки и сравнение с buy-and-hold.</div><h2>Крипторынок</h2>` +
      L.crypto.items.map(x => `<div class="row"><div>${esc(x.name)}<div class="dim"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>${x.state ? ' · ' + esc(x.state) : ''}</div></div><div class="v">${esc(x.disp)}</div></div>`).join('');
  }
  $('#sheetIn').innerHTML = `<span class="x" onclick="$('#sheet').classList.remove('open')">× закрыть</span><div class="eb">${esc(t)}</div><div class="big t">${esc(big)}</div>` +
    (series && H && Array.isArray(H[series]) ? `<div class="tabs">${[30, 90, 365].map(d => `<button class="${d === days ? 'on' : ''}" onclick="days=${d};openSheet('${k}')">${d} дн.</button>`).join('')}</div><canvas id="cv"></canvas><div class="dim">${esc(H.note)}</div>` : '') + body;
  $('#sheet').classList.add('open');
  if (series && H && Array.isArray(H[series])) draw(H[series], H.dates, unit);
}

function setDays(d){days=d;render();}
function draw(vals, dates, unit) { drawTo('cv',vals,dates,unit); }
function drawTo(id, vals, dates, unit) {
  const c = document.getElementById(id); if(!c || !Array.isArray(vals) || !Array.isArray(dates))return;
  const r = Math.min(window.devicePixelRatio || 1,2), w = c.clientWidth, h = c.clientHeight;
  c.width = w * r; c.height = h * r;
  const g = c.getContext('2d'); g.scale(r, r);
  const n = Math.min(days, vals.length, dates.length), V = vals.slice(-n), Dt = dates.slice(-n), ok = V.filter(Number.isFinite);
  g.font = '10px ui-monospace,Menlo,monospace'; g.fillStyle = '#6b6b6b'; g.strokeStyle = '#111'; g.lineWidth = 1.5;
  if (!ok.length) { g.fillText('Нет данных', 4, 16); return; }
  let lo = Math.min(...ok), hi = Math.max(...ok); if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  const X = i => 4 + i * (w - 8) / Math.max(1, n - 1), Y = y => h - 14 - (y - lo) / (hi - lo) * (h - 26);
  g.beginPath(); let pen = false;
  V.forEach((y, i) => { if (!Number.isFinite(y)) { pen = false; return; } pen ? g.lineTo(X(i), Y(y)) : g.moveTo(X(i), Y(y)); pen = true; });
  g.stroke();
  g.fillText(hi.toFixed(unit ? 0 : 0) + unit, 4, 10); g.fillText(lo.toFixed(0) + unit, 4, h - 16);
  g.fillText(String(Dt[0] || '').slice(5), 4, h - 2); const e = String(Dt[n - 1] || '').slice(5); g.fillText(e, w - 4 - g.measureText(e).width, h - 2);
}
</script>
