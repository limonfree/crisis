name: update-data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crisis-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate crisis data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u collect.py

      - name: Validate output
        run: |
          test -s data/latest.json
          test -s data/history.json
          python -m json.tool data/latest.json >/dev/null
          python -m json.tool data/history.json >/dev/null

      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json data/history.json data/source_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "data update"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
