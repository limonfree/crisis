name: update-data
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - run: |
          for i in 1 2 3; do
            echo "Test $i"
            curl -v -L \
              --connect-timeout 10 \
              --max-time 25 \
              -o /tmp/fred.csv \
              -w 'HTTP %{http_code}, time %{time_total}s\n' \
              'https://fred.stlouisfed.org/graph/fredgraph.csv?id=WALCL' \
              && head -n 3 /tmp/fred.csv && break
          sleep 5 
          done
      - run: python collect.py
      - run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || (git commit -m "data update" && git push)
