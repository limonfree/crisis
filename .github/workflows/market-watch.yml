name: market-watch

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '15,45 13-23 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crisis-data-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh market data
        run: |
          python -u market_watch.py

      - name: Publish market watch
        run: |
          test -s data/market_watch.json
          python -m json.tool data/market_watch.json > /dev/null

          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"

          git add data/market_watch.json

          if ! git diff --cached --quiet; then
            git commit -m "Update market watch"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes"
          fi
